---
layout: default
---
<article class="page-shell">
  {% include breadcrumbs.html %}
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="intro-note">{{ page.intro }}</p>{% endif %}
    {% assign quest_sync = site.data.quest_releases._meta.updated_at %}
    {% include sync-engine.html timestamp=quest_sync %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>

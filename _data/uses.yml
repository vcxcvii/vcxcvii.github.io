# Source of truth for /uses-this/. Icons resolve through _includes/logo.html.
# Every logo value must exist as _includes/logos/<logo>.svg.
# name       plain text, used for structured data.
# url        primary destination, used for structured data and for the link.
# name_md    optional. Use when one row names several products, so each one
#            carries its own link instead of the row carrying only the first.
- id: hardware
  title: Hardware
  schema_type: Product
  items:
    - name: "MacBook Air, 13-inch, M2, 8 GB RAM, 256 GB storage"
      logo: laptop
      url: "https://www.apple.com/macbook-air/"
      note: "Personal computer, and still a beast even in 2026."
    - name: "Samsung M8 Monitor"
      logo: monitor
      url: "https://www.samsung.com/in/monitors/smart-monitor/"
      note: "My monitor and TV. Easily one of the best purchases I have made."
    - name: "Apple Watch SE"
      logo: watch
      url: "https://www.apple.com/apple-watch-se/"
      note: "Got this in 2022 and it still runs pretty well. I use it to log my workouts. Funnily enough, not to see the time."
    - name: "iPhone 16 Pro Max"
      logo: phone
      url: "https://www.apple.com/iphone-16-pro/"
      note: "Got the base model, and it runs really well. The titanium body is a huge plus."
    - name: "AirPods Pro 2"
      logo: earbuds
      url: "https://www.apple.com/airpods-pro/"
      note: "Got this in 2022. It is terrific and has survived a thousand falls, not kidding."
    - name: "iPad Air, M1, 11-inch"
      logo: tablet
      url: "https://www.apple.com/ipad-air/"
      note: "Used to be a replacement for a TV in 2022 when I lived alone abroad. In 2026, it continues to be a glorified Kindle and TV. I have the Apple Pencil too, but I rarely use it."
    - name: "Apple HomePod mini"
      logo: speaker
      url: "https://www.apple.com/homepod-mini/"
      note: "Terrific speaker."
    - name: "Logitech MX Master 3S, MX Keys, and palm rest"
      logo: keyboard
      url: "https://www.logitech.com/en-in/products/mice/mx-master-3s.html"
      name_md: "[Logitech MX Master 3S, MX Keys, and palm rest](https://www.logitech.com/en-in/products/mice/mx-master-3s.html)"
      note: "The best keyboard and mouse combo. Expensive, but I can type the fastest on it."

- id: software
  title: Software
  schema_type: SoftwareApplication
  items:
    - name: "Apple Books and Kindle"
      logo: book
      url: "https://www.apple.com/apple-books/"
      name_md: "[Apple Books](https://www.apple.com/apple-books/) and [Kindle](https://www.amazon.in/kindle-dbs/storefront)"
      note: "Apple Books because I used to pirate ebooks out of Library Genesis until it shut down. I then bought a Kindle subscription."
    - name: "Google Chrome"
      logo: googlechrome
      url: "https://www.google.com/chrome/"
      note: "Daily driver. I have tried Comet, Dia, Helium, Safari, and others. Nothing beats the portability and reliability of Chrome."
    - name: "Claude and Codex"
      logo: claude
      url: "https://claude.ai/"
      name_md: "[Claude](https://claude.ai/) and [Codex](https://openai.com/codex/)"
      note: "I am a huge terminal guy, so I use most AI models from there."
    - name: "Cursor"
      logo: cursor
      url: "https://cursor.com/"
      note: "AI-first code editor. I use it for longer-form coding sessions where I want a full IDE experience alongside my terminal agents."
    - name: "cmux"
      logo: terminal
      url: "https://github.com/manaflow-ai/cmux"
      note: "Native Mac terminal is good, but I like vertical tabs + lightweight ADE capabilities."

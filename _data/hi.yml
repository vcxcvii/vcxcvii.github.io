# Homepage only. Cycles the h1's opening word through greetings across
# languages, with the English translation in parentheses. The build picks
# one by day of year so a reader without JavaScript still sees it change;
# assets/js/hi.js then picks a fresh one per visit and never repeats the
# last one in the tab. The rest of the h1 (`, I'm Varun Choraria (VC).`)
# is fixed, so every line has to read correctly with a comma directly
# after it. English is one of the lines and stays plain, without the
# translation parenthetical.

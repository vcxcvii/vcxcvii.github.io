# Homepage only. Cycles the h1's opening word through greetings across
# languages, with a short English rendering in parentheses that reads
# as a greeting word, not a sentence: "A bow", "Peace", "Welcome",
# "Good day", "Hello" — never a first-person verb like "I bow to you"
# or "Your servant", because the h1 continues with ", I'm Varun
# Choraria (VC)." and the parenthetical sits right next to that
# comma. Where the native word's cultural root nominalises cleanly
# ("A bow" for नमस्ते), use it; where it doesn't, use "Hello" or
# "Greetings".
#
# Every greeting is written in its own regional script. Languages that
# natively use the Latin alphabet (Finnish Terve, French Bonjour,
# Hawaiian Aloha, Zulu Sawubona, Vietnamese Xin chào) stay as-is;
# that IS their native script. Languages with non-Latin scripts
# appear in that script only, not in Latin transliteration — नमस्ते,
# not "Namaste"; שלום, not "Shalom"; สวัสดี, not "Sawasdee".
#
# The build picks one by day of year so a reader without JavaScript
# still sees it change; assets/js/hi.js then picks a fresh one per
# visit and never repeats the last one in the tab. English is one of
# the lines and stays plain, without the parenthetical.

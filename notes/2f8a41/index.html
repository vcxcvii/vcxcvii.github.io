const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:DATA.iter,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function unlock(pw){
  for(const w of DATA.wraps){
    try{
      const k=await derive(pw,b64(w.salt));
      const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(w.iv)},k,b64(w.ct));
      const ck=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
      const html=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.payload.iv)},ck,b64(DATA.payload.ct));
      return new TextDecoder().decode(html);
    }catch(e){}
  }
  return null;
}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  const btn=document.getElementById('go'), err=document.getElementById('err');
  btn.disabled=true; err.textContent='Checking...';
  const html=await unlock(document.getElementById('pw').value.trim().toLowerCase());
  if(!html){ btn.disabled=false; err.textContent='That address does not open this note. Check for typos.'; return; }
  document.getElementById('gate').remove();
  const c=document.getElementById('content');
  c.innerHTML=html; c.hidden=false;
  var h=c.querySelector('h1');
  if(h)document.title=h.textContent.slice(0,70);
  initMemo();
});
function initMemo(){
  var tabs=[].slice.call(document.querySelectorAll('.tabbar button')),
      panels=[].slice.call(document.querySelectorAll('.panel'));
  function show(id,push){
    if(!panels.some(function(p){return p.id===id;}))id='working';
    panels.forEach(function(p){p.classList.toggle('on',p.id===id);});
    tabs.forEach(function(t){t.setAttribute('aria-selected',String(t.dataset.p===id));});
    if(push&&history.replaceState)history.replaceState(null,'','#'+id);
  }
  tabs.forEach(function(t){t.addEventListener('click',function(){
    show(t.dataset.p,true);});});
  if(location.hash)show(location.hash.slice(1),false);
  window.addEventListener('hashchange',function(){show(location.hash.slice(1),false);});

  var ids=['acv','opps','mkt','mktacv','prt','mgn','lift','cmp','d2w','cmpl'];
  function v(id){return parseFloat(document.getElementById(id).value)||0;}
  function money(n){return '$'+Math.round(n/1000)+'K';}
  function calc(){
    var acv=v('acv'), opps=v('opps'), mktD=v('mkt'), mktA=v('mktacv'),
        prtD=v('prt'), mgn=v('mgn')/100, lift=v('lift')/100,
        cmpQ=v('cmp'), d2w=v('d2w')/100, cmplD=v('cmpl');
    var out={mkt:mktD*mktA, prt:prtD*acv*(1-mgn), rev:opps*lift*acv,
             cmp:cmpQ*3*d2w*acv, cml:cmplD*acv}, tot=0, totB=0;
    ['mkt','prt','rev','cmp','cml'].forEach(function(k){
      var base=out[k], bear=base*(2/3);
      document.getElementById('o-'+k).textContent=money(base);
      document.getElementById('o-'+k+'-b').textContent=money(bear);
      tot+=base; totB+=bear;
    });
    document.getElementById('o-tot').textContent=money(tot);
    document.getElementById('o-tot-b').textContent=money(totB);
  }
  ids.forEach(function(id){document.getElementById(id).addEventListener('input',calc);});
  calc();
}
</script>

title: Varun Choraria
description: Varun Choraria's personal site. Essays on GTM, product marketing, management and AI, plus open-source AI tools.
author_description: B2B SaaS product marketer with 8+ years across Vymo, Freshworks and GTM Buddy. Group Manager, Product Marketing at HCL Tech.
author:
  name: Varun Choraria
  uri: https://www.varunchoraria.com/about/
url: "https://www.varunchoraria.com"
baseurl: ""
timezone: Asia/Kolkata
markdown: kramdown
highlighter: rouge
permalink: /:slug/
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

sass:
  style: compressed
  sourcemap: never
# Build posts dated ahead of the build clock. Post dates on this site are a
# publishing decision rather than a wall-clock fact, so a post scheduled for
# tomorrow should ship when it is written, carrying tomorrow's date.
future: true

exclude:
  - AGENTS.md
  - CLAUDE.md
  - DESIGN.md
  # Notes for coding assistants (issue tracker, triage labels, domain docs).
  # They carry no frontmatter, so unlisted they would publish as raw files.
  - docs
  - FEEDBACK.md
  - RAINMAKER.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - frontend
  # Rainmaker's local working context. Gitignored, so CI never sees it, but a
  # local build would otherwise render it into the sitemap and fail the MCP
  # feed parity check in _scripts/check-built-site.rb for a reason that cannot
  # happen in CI.
  - context

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
  - scope:
      path: ""
      type: "posts"
    values:
      layout: entry
      section_name: Note

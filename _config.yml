title: Varun Choraria
description: B2B SaaS marketing operator. I decide what marketing should do next, ship the work, and measure it in pipeline or revenue. Essays and open-source AI tools.
author_description: B2B SaaS marketing operator. I decide what marketing should do next, ship the work, and measure it in pipeline or revenue. Consulting, open to senior roles.
author:
  name: Varun Choraria
  uri: https://www.varunchoraria.com/about/
url: "https://www.varunchoraria.com"
baseurl: ""
timezone: Asia/Kolkata
markdown: kramdown
highlighter: rouge
permalink: /:slug/
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

sass:
  style: compressed
  sourcemap: never
exclude:
  - DESIGN.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - frontend

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
  - scope:
      path: ""
      type: "posts"
    values:
      layout: entry
      section_name: Note

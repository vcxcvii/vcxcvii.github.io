name: Refresh side-quest changelogs and GitHub graph

# Pulls releases (falling back to commits) for every repo listed in
# _data/quests.yml, and the homepage's contribution graph data, then commits
# the result. Pushing to main triggers the existing Pages deploy. The graph
# data is fetched here rather than client-side so the homepage renders it
# synchronously instead of waiting on a third-party API round trip.
on:
  schedule:
    - cron: "17 4 * * *"   # daily, 09:47 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-quests
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test changelog relevance and synthesis
        run: python3 _scripts/test_refresh_quests.py

      - name: Refresh quest changelog data
        env:
          # QUESTS_TOKEN is only needed to read private repos (e.g. lazarus-pit).
          # Without it the script still works and simply skips what it cannot read.
          GH_TOKEN: ${{ secrets.QUESTS_TOKEN || github.token }}
        run: python3 _scripts/refresh_quests.py

      - name: Refresh GitHub contribution graph data
        run: python3 _scripts/refresh_github_graph.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/quest_releases.yml _data/github_contributions.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/quest_releases.yml _data/github_contributions.json
          git commit -m "chore: refresh side-quest changelogs and GitHub graph"
          git push

name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "_data/site_updates.json"
  # Jekyll skips posts dated ahead of the build clock, so a date-scheduled post
  # only appears once something rebuilds the site on or after its date. The
  # daily quest refresh pushes only when its data actually changed, which is
  # usually but not reliably every day. This makes the rebuild unconditional.
  schedule:
    - cron: "5 1 * * *" # daily, 06:35 IST
  workflow_dispatch:

permissions:
  contents: write
  models: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 50
      - name: Test visitor changelog pipeline
        run: python3 _scripts/test_refresh_site_changelog.py
      - name: Synthesize visitor changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_MODEL: openai/gpt-4.1
        run: python3 _scripts/refresh_site_changelog.py
      - name: Save visitor changelog update
        run: |
          if git diff --quiet -- _data/site_updates.json; then
            echo "no visitor changelog change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/site_updates.json
          git commit -m "chore: refresh visitor changelog"
          if ! git push; then
            echo "::warning::changelog rendered for this deploy but could not be pushed; next run will retry"
          fi
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Audit Ruby dependencies
        run: bundle exec bundle-audit check --update
      - name: Lint Ruby
        run: |
          ruby -c _scripts/qa.rb
          ruby -c _scripts/validate-posts.rb
      - name: Lint JavaScript
        run: node --check assets/js/gh-graph.js
      - name: Validate posts
        run: ruby _scripts/validate-posts.rb
      - name: Run site QA
        run: bundle exec ruby _scripts/qa.rb --all
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Check built HTML, schema, images, and links
        run: ruby _scripts/check-built-site.rb
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

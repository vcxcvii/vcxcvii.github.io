name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "_data/site_updates.json"
  workflow_dispatch:

permissions:
  contents: write
  models: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Test visitor changelog pipeline
        run: python3 _scripts/test_refresh_site_changelog.py
      - name: Synthesize visitor changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_MODEL: openai/gpt-4.1
        run: python3 _scripts/refresh_site_changelog.py
      - name: Save visitor changelog update
        run: |
          if git diff --quiet -- _data/site_updates.json; then
            echo "no visitor changelog change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/site_updates.json
          git commit -m "chore: refresh visitor changelog"
          if ! git push; then
            echo "::warning::changelog rendered for this deploy but could not be pushed; next run will retry"
          fi
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Lint Ruby
        run: |
          ruby -c _scripts/qa.rb
          ruby -c _scripts/validate-posts.rb
      - name: Lint JavaScript
        run: node --check assets/js/gh-graph.js
      - name: Validate posts
        run: ruby _scripts/validate-posts.rb
      - name: Run site QA
        run: ruby _scripts/qa.rb --all
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

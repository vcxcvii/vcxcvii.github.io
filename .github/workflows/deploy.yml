name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "_data/site_updates.json"
  # Jekyll skips posts dated ahead of the build clock, so a date-scheduled post
  # only appears once something rebuilds the site on or after its date. The
  # daily quest refresh pushes only when its data actually changed, which is
  # usually but not reliably every day. This makes the rebuild unconditional.
  schedule:
    - cron: "5 1 * * *" # daily, 06:35 IST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test visitor changelog pipeline
        run: python3 _scripts/test_refresh_site_changelog.py
      - name: Refresh visitor changelog
        run: python3 _scripts/refresh_site_changelog.py
      - name: Save visitor changelog update
        run: |
          if git diff --quiet -- _data/site_updates.json; then
            echo "no visitor changelog change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/site_updates.json
          git commit -m "chore: refresh visitor changelog"
          if ! git push; then
            echo "::warning::changelog rendered for this deploy but could not be pushed; next run will retry"
          fi
      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Audit Ruby dependencies
        run: bundle exec bundle-audit check --update
      - name: Lint Ruby
        run: |
          ruby -c _scripts/qa.rb
          ruby -c _scripts/validate-posts.rb
      - name: Lint JavaScript
        run: |
          node --check assets/js/gh-graph.js
          node --check assets/js/changelog.js
      - name: Test downloads build
        run: python3 _scripts/test_generate_downloads.py
      - name: Validate posts
        run: ruby _scripts/validate-posts.rb
      - name: Run site QA
        run: bundle exec ruby _scripts/qa.rb --all
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # pandoc and Google Chrome both ship on the runner image. The guard is
      # for the day one of them does not: a missing converter would otherwise
      # surface as 46 broken download links in the link check below.
      - name: Install ePub converter
        run: command -v pandoc || { sudo apt-get update && sudo apt-get install -y pandoc; }
      # After Jekyll and before the link check, deliberately: the essay layout
      # links these files, check-built-site.rb resolves every internal href,
      # and that is what proves the generator ran. The files are never
      # committed; they ride out inside the Pages artifact.
      - name: Build essay downloads
        run: python3 _scripts/generate_downloads.py
      - name: Check built HTML, schema, images, and links
        run: ruby _scripts/check-built-site.rb
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
